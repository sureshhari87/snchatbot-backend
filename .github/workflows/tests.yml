name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  APP_ENV: "test"
  TESTING: "1"
  APP_DEBUG: "0"
  SECRET_KEY: "ci-test-secret-key"
  DATABASE_URL: "sqlite://"
  RUN_MIGRATIONS_ON_STARTUP: "0"
  FRONTEND_VERIFY_URL: "http://localhost:3000/verify-email"
  FRONTEND_RESET_URL: "http://localhost:3000/reset-password"
  MAX_REQUEST_BODY_BYTES: "1048576"
  HTTPS_REDIRECT: "0"
  TRUSTED_HOSTS: "*"
  PROXY_HEADERS: "1"
  FORWARDED_ALLOW_IPS: "*"
  HOST: "0.0.0.0"
  PORT: "7860"
  WEB_CONCURRENCY: "1"
  UVICORN_LOG_LEVEL: "warning"

jobs:
  quality:
    name: Format And Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install quality tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Check formatting
        run: ruff format --check .

      - name: Run lint checks
        run: ruff check .

      - name: Secret hygiene scan
        run: python scripts/secret_hygiene_check.py

  tests:
    name: Tests And Coverage
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run tests with coverage threshold
        run: |
          python -m pytest \
            --cov=main \
            --cov=models \
            --cov=schemas \
            --cov=database \
            --cov=config \
            --cov-fail-under=80 \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-report=html \
            --cov-report=markdown-append:${GITHUB_STEP_SUMMARY} \
            -q

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python-version }}
          path: |
            coverage.xml
            htmlcov/
          if-no-files-found: error

  security:
    name: Security Scans
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install security tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Bandit static security scan
        run: bandit -c pyproject.toml -r .

      - name: Dependency vulnerability audit
        run: pip-audit --progress-spinner off -r requirements.txt

  docker-build:
    name: Docker Build Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build --pull=false -t snchatbot-backend:ci .

  staging-smoke-tests:
    name: Isolated Container Staging
    runs-on: ubuntu-latest
    needs: [quality, tests, security, docker-build]
    timeout-minutes: 15
    # Disposable CI credentials only. Never attach production or Neon secrets.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: staging_ci
          POSTGRES_PASSWORD: ephemeral-ci-only
          POSTGRES_DB: staging_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U staging_ci -d staging_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the real deployment image
        run: docker build -t snchatbot-backend:staging .

      - name: Start isolated backend and apply migrations
        run: |
          docker run -d --name staging-backend --network host \
            -e APP_ENV=staging -e TESTING=0 \
            -e DATABASE_URL=postgresql+psycopg://staging_ci:ephemeral-ci-only@127.0.0.1:5432/staging_ci \
            -e SECRET_KEY=isolated-ci-only-jwt-signing-key-not-used-in-production \
            -e RUN_MIGRATIONS_BEFORE_START=1 -e RUN_MIGRATIONS_ON_STARTUP=0 \
            -e HTTPS_REDIRECT=0 -e PORT=7860 -e HOST=127.0.0.1 \
            -e CORS_ORIGINS=http://127.0.0.1:7860 \
            -e FIRESTORE_COMMERCE_ENABLED=0 -e FIREBASE_AUTH_ENABLED=0 \
            -e LLM_ENABLED=0 -e ADMIN_BOOTSTRAP_ENABLED=0 \
            -e PROXY_HEADERS=0 \
            snchatbot-backend:staging

      - name: Verify readiness and deployed contracts
        env:
          SMOKE_BASE_URL: http://127.0.0.1:7860
          SMOKE_EXPECT_LATEST_CHAT_CONTRACT: "1"
          SMOKE_EXPECT_COMMERCE_CONTRACT: "1"
          SMOKE_RETRIES: "24"
        run: python scripts/smoke_test.py

      - name: Show isolated backend logs on failure
        if: failure()
        run: docker logs staging-backend

      - name: Stop isolated backend
        if: always()
        run: docker rm -f staging-backend || true

  deploy-production:
    name: Production Deploy
    runs-on: ubuntu-latest
    needs: staging-smoke-tests
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production

    steps:
      - name: Trigger production deploy when configured
        env:
          PRODUCTION_DEPLOY_WEBHOOK: ${{ secrets.PRODUCTION_DEPLOY_WEBHOOK }}
        run: |
          if [ -z "$PRODUCTION_DEPLOY_WEBHOOK" ]; then
            echo "PRODUCTION_DEPLOY_WEBHOOK is not configured; skipping production deploy."
            exit 0
          fi

          curl -fsS -X POST "$PRODUCTION_DEPLOY_WEBHOOK"
